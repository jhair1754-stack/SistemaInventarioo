# ============================================================
# Configuración de la Aplicación — Inventario Electrodomésticos
# ============================================================

# --- Servidor ---
server.port=8080

# --- SQL Server DataSource ---
# IMPORTANTE: Ajusta estos valores según tu instancia de SQL Server.
# Antes de ejecutar, crea la base de datos manualmente:
#   CREATE DATABASE inventario_electrodomesticos;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=inventario_electrodomesticos;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=root
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# Hibernate 6.4+ (Spring Boot 3.4.x) auto-detecta el dialecto desde la conexión JDBC.
# No se necesita configurar hibernate.dialect explícitamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson (JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# --- Logging ---
logging.level.com.distribumax.inventario=DEBUG
logging.level.org.hibernate.SQL=DEBUG
